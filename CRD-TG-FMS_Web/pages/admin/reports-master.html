<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FMS Reports Master</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="../../css/style.css">
<style>body{background:#f4f6f9}.hero{background:#0d6efd;color:white;padding:18px}.card{border:0}.field-box{height:220px}.sticky-tools{position:sticky;top:0;z-index:50}</style></head><body>
<header class="hero text-center"><div class="fw-semibold">GOVERNMENT OF TELANGANA</div><div>Office of the Commissioner, Rural Development</div><h2 class="mb-0">REPORTS MASTER</h2></header>
<nav class="navbar bg-white border-bottom shadow-sm sticky-tools"><div class="container-fluid d-flex gap-2 flex-wrap p-2">
<button id="btnHome" class="btn btn-dark"><i class="bi bi-house"></i> Home</button><button id="btnMasters" class="btn btn-secondary"><i class="bi bi-database"></i> Master Tables</button><button id="btnReports" class="btn btn-primary"><i class="bi bi-bar-chart"></i> Central Reports</button>
<span id="status" class="ms-auto small text-muted align-self-center"></span>
</div></nav>
<main class="container-fluid py-3"><div class="row g-3"><div class="col-lg-5"><div class="card shadow-sm"><div class="card-header bg-primary text-white fw-bold">Custom Report Definition</div><div class="card-body"><form id="reportDefForm"><input type="hidden" id="definitionId">
<div class="row g-3"><div class="col-md-7"><label class="form-label">Report Name *</label><input id="reportName" class="form-control" required></div><div class="col-md-5"><label class="form-label">Module *</label><select id="module" class="form-select" required><option value="cpgrams">GRIEVANCES</option><option value="rti">RTI</option><option value="disha">DISHA</option><option value="all">All Modules</option></select></div>
<div class="col-12"><label class="form-label">Fields / Columns *</label><select id="fields" class="form-select field-box" multiple required></select><div class="form-text">Ctrl/Command-click to select multiple columns. Columns are shown in the order listed.</div></div>
<div class="col-md-5"><label class="form-label">Filter Field</label><select id="filterField" class="form-select"></select></div><div class="col-md-3"><label class="form-label">Operator</label><select id="operator" class="form-select"><option value="contains">Contains</option><option value="equals">Equals</option><option value="notEquals">Not Equals</option><option value="gt">Greater Than</option><option value="gte">Greater/Equal</option><option value="lt">Less Than</option><option value="lte">Less/Equal</option><option value="isEmpty">Is Empty</option><option value="notEmpty">Not Empty</option></select></div><div class="col-md-4"><label class="form-label">Filter Value</label><input id="filterValue" class="form-control"></div>
<div class="col-md-5"><label class="form-label">Sort Field</label><select id="sortField" class="form-select"></select></div><div class="col-md-3"><label class="form-label">Direction</label><select id="sortDirection" class="form-select"><option value="asc">Ascending</option><option value="desc">Descending</option></select></div><div class="col-md-4"><label class="form-label">Default Date Range</label><select id="datePreset" class="form-select"><option value="none">None</option><option value="currentFY">Current FY</option><option value="today">Today</option><option value="last7">Last 7 Days</option><option value="last30">Last 30 Days</option></select></div>
<div class="col-12"><label class="form-label">Description</label><textarea id="description" class="form-control" rows="2"></textarea></div><div class="col-12"><div class="form-check"><input id="active" type="checkbox" class="form-check-input" checked><label class="form-check-label">Active</label></div></div></div>
<div class="d-flex gap-2 flex-wrap mt-3"><button class="btn btn-success" type="submit"><i class="bi bi-save"></i> Save</button><button id="btnUpdate" type="button" class="btn btn-warning"><i class="bi bi-pencil"></i> Update</button><button id="btnDelete" type="button" class="btn btn-danger"><i class="bi bi-trash"></i> Delete</button><button id="btnClear" type="button" class="btn btn-outline-secondary">Clear</button></div></form></div></div></div>
<div class="col-lg-7"><div class="card shadow-sm"><div class="card-header bg-dark text-white d-flex justify-content-between"><span class="fw-bold">Custom Reports Register</span><span id="recordCount" class="badge bg-light text-dark">0 records</span></div><div class="card-body"><input id="search" class="form-control mb-2" placeholder="Search reports..."><div class="table-responsive"><table id="definitionsTable" class="table table-bordered table-striped table-hover"><thead><tr><th>Sl.No</th><th>Report Name</th><th>Module</th><th>Columns</th><th>Filter</th><th>Status</th><th>Action</th></tr></thead><tbody></tbody></table></div></div></div></div></div></main>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script><script src="../../js/firebase/firebase-bootstrap.js"></script><script src="../../js/reports-master.js"></script></body></html>
