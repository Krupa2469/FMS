<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CPGRAMS File Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="../../css/style.css">

</head>

<body>

<header class="bg-primary text-white text-center p-3">

<h5>GOVERNMENT OF TELANGANA</h5>

<h6>OFFICE OF THE COMMISSIONER OF RURAL DEVELOPMENT</h6>

<h3>FILE MANAGEMENT SYSTEM (FMS)</h3>

</header>

<div class="container-fluid mt-4">

<div class="d-flex justify-content-between align-items-center">

<h3>CPGRAMS File Register</h3>

<div>

<button class="btn btn-success"
        onclick="window.location.href='cpgrams.html'">

New File

</button>

<button class="btn btn-secondary"
        onclick="goHome()">

Home

</button>

</div>

</div>

<hr>

<!-- SEARCH -->

<div class="card">

<div class="card-header bg-light">

<b>Search Filters</b>

</div>

<div class="card-body">

<div class="row">

<div class="col-md-3">

<label>File Number</label>

<input type="text"
       id="searchFileNo"
       class="form-control">

</div>

<div class="col-md-3">

<label>Grievance Number</label>

<input type="text"
       id="searchGrievanceNo"
       class="form-control">

</div>

<div class="col-md-3">

<label>District</label>

<select id="searchDistrict"
        class="form-select">

<option value="">All</option>

</select>

</div>

<div class="col-md-3">

<label>Status</label>

<select id="searchStatus"
        class="form-select">

<option value="">All</option>

<option>Under Circulation</option>

<option>Disposed</option>

</select>

</div>

</div>

<div class="mt-3">

<button class="btn btn-primary"
        onclick="searchRecords()">

Search

</button>

<button class="btn btn-warning"
        onclick="loadRecords()">

Reset

</button>

</div>

</div>

</div>

<br>

<!-- RECORD LIST -->

<div class="card">

<div class="card-header bg-light">

<b>Registered Files</b>

</div>

<div class="card-body table-responsive">

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>S.No</th>

<th>File Number</th>

<th>Grievance No</th>

<th>Complainant</th>

<th>District</th>

<th>Date Received</th>

<th>Due Date</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="recordTable">

</tbody>

</table>

</div>

</div>

</div>

<footer class="bg-light text-center mt-5 p-3">

<small>

© <span id="currentYear"></span>

File Management System

Version

<span id="appVersion"></span>

</small>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../../js/app.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/storage.js"></script>
<script src="../../js/master-data.js"></script>
<script src="../../js/navigation.js"></script>

<script src="cpgrams-list.js"></script>

</body>

</html>
