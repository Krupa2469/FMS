<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CPGRAMS Search</title>

<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/grid.css">

</head>

<body>

<header class="page-header">

    <h2>Government of Telangana</h2>

    <h3>File Management System (FMS)</h3>

    <h4>CPGRAMS Search</h4>

</header>

<div class="container">

<div class="card">

<h3>Search Filters</h3>

<table class="entryTable">

<tr>

<td>Grievance No.</td>

<td>
<input
type="text"
id="grievanceNumber">
</td>

<td>File Number</td>

<td>
<input
type="text"
id="fileNumber">
</td>

</tr>

<tr>

<td>Complainant</td>

<td>
<input
type="text"
id="complainantName">
</td>

<td>District</td>

<td>

<select id="district">

<option value="">All</option>

</select>

</td>

</tr>

<tr>

<td>Status</td>

<td>

<select id="status">

<option value="">All</option>

<option>Pending</option>

<option>Disposed</option>

<option>Under Process</option>

</select>

</td>

<td>Assigned Officer</td>

<td>

<select id="assignedOfficer">

<option value="">All</option>

</select>

</td>

</tr>

<tr>

<td>From Date</td>

<td>

<input
type="date"
id="fromDate">

</td>

<td>To Date</td>

<td>

<input
type="date"
id="toDate">

</td>

</tr>

</table>

<div class="buttonBar">

<button id="btnSearch">

Search

</button>

<button id="btnClear">

Clear

</button>

<button id="btnExport">

Export Excel

</button>

</div>

</div>

<div class="card">

<h3>Search Results</h3>

<table
id="resultsGrid"
class="grid">

<thead>

<tr>

<th>Grievance No.</th>

<th>File No.</th>

<th>Name</th>

<th>District</th>

<th>Status</th>

<th>Due Date</th>

<th>Action</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<script src="../../js/firebase/firebase-config.js"></script>
<script src="../../js/firebase/firebase-service.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/master-service.js"></script>
<script src="cpgrams-search.js"></script>

</body>

</html>
