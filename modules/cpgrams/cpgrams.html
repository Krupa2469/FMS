<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CPGRAMS Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="../../css/style.css">

</head>

<body>

<header class="bg-primary text-white text-center p-3">

    <h5>GOVERNMENT OF TELANGANA</h5>

    <h6>OFFICE OF THE COMMISSIONER OF RURAL DEVELOPMENT</h6>

    <h3>FILE MANAGEMENT SYSTEM (FMS)</h3>

</header>



<div class="container mt-4">

<div class="d-flex justify-content-between">
       
    

<h3>CPGRAMS File Registration</h3>

<div class="text-center mt-4 mb-4">

    <button
        type="button"
        class="btn btn-success"
        onclick="saveRecord()">
        Save
    </button>

    <button
        type="button"
        class="btn btn-primary"
        onclick="updateRecord()">
        Update
    </button>

    <button
        type="button"
        class="btn btn-danger"
        onclick="deleteRecord()">
        Delete
    </button>

    <button
        type="button"
        class="btn btn-warning"
        onclick="clearForm()">
        Clear
    </button>

    <button
        type="button"
        class="btn btn-secondary"
        onclick="goHome()">
        Home
    </button>

</div>   

<!-- ==========================================================
FILE INFORMATION
=========================================================== -->

<div class="card shadow-sm mb-4">

    <div class="card-header bg-primary text-white">

        <h5 class="mb-0">
            File Information
        </h5>

    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-4">

                <label class="form-label">
                    File Number
                </label>

                <input
                    type="text"
                    id="fileNumber"
                    class="form-control"
                    readonly>

            </div>

            <div class="col-md-4">

                <label class="form-label">
                    Grievance Number
                </label>

                <input
                    type="text"
                    id="grievanceNumber"
                    class="form-control">

            </div>

            <div class="col-md-4">

                <label class="form-label">
                    Date Received
                </label>

                <input
                    type="date"
                    id="dateReceived"
                    class="form-control">

            </div>

        </div>

        <div class="row mt-3">

            <div class="col-md-4">

                <label class="form-label">
                    Due Date
                </label>

                <input
                    type="date"
                    id="dueDate"
                    class="form-control"
                    readonly>

            </div>

            <div class="col-md-4">

                <label class="form-label">
                    Priority
                </label>

                <select
                    id="priority"
                    class="form-select">
                </select>

            </div>

            <div class="col-md-4">

                <label class="form-label">
                    Status
                </label>

                <select
                    id="status"
                    class="form-select">
                </select>

            </div>

        </div>

    </div>

</select>

</div>

</div>

<br>

<div class="row">

<div class="col-md-6">

<label class="form-label">

Mandal

</label>

<input type="text"
       id="mandal"
       class="form-control">

</div>

<div class="col-md-6">

<label class="form-label">

Village

</label>

<input type="text"
       id="village"
       class="form-control">

</div>

</div>

<br>

<div class="row">

<div class="col-md-12">

<label class="form-label">

Subject

</label>

<input type="text"
       id="subject"
       class="form-control">

</div>

</div>

<br>

<div class="row">

<div class="col-md-12">

<label class="form-label">

Grievance Description

</label>

<textarea id="description"
          rows="5"
          class="form-control"></textarea>

</div>

</div>

<br>

<div class="row">

<div class="col-md-4">

<label class="form-label">


Assigned To

</label>

<select id="assignedTo"
        class="form-select">

<option value="">--Select--</option>

</select>

</div>

<div class="col-md-4">

<label class="form-label">

       <div class="col-md-4">

    <label class="form-label">
      
</div>

</div>

<br>

<div class="row">

<div class="col-md-12">

<label class="form-label">

Remarks

</label>

<textarea id="remarks"

          class="form-control"></textarea>

</div>

</div>

<footer class="bg-light text-center mt-5 p-3">

<small>

</footer>
<!-- ==========================================================
COMPLAINANT DETAILS
=========================================================== -->

<div class="card shadow-sm mb-4">

    <div class="card-header bg-success text-white">

        <h5 class="mb-0">
            Complainant Details
        </h5>

    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-6">

                <label class="form-label">
                    Complainant Name <span class="text-danger">*</span>
                </label>

                <input
                    type="text"
                    id="complainantName"
                    class="form-control"
                    maxlength="100"
                    placeholder="Enter complainant name">

            </div>

            <div class="col-md-3">

                <label class="form-label">
                    Mobile Number
                </label>

                <input
                    type="text"
                    id="mobileNumber"
                    class="form-control"
                    maxlength="10"
                    placeholder="10-digit mobile">

            </div>

            <div class="col-md-3">

                <label class="form-label">
                    Email ID
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="name@email.com">

            </div>

        </div>

        <div class="row mt-3">

            <div class="col-md-4">

                <label class="form-label">
                    District <span class="text-danger">*</span>
                </label>

                <select
                    id="district"
                    class="form-select">
                </select>

            </div>

            <div class="col-md-4">

                <label class="form-label">
                    Mandal
                </label>

                <select
                    id="mandal"
                    class="form-select">

                    <option value="">-- Select Mandal --</option>

                </select>

            </div>

            <div class="col-md-4">

                <label class="form-label">
                    Village
                </label>

                <select
                    id="village"
                    class="form-select">

                    <option value="">-- Select Village --</option>

                </select>

            </div>

        </div>

    </div>

</div>

<!-- ==========================================================
GRIEVANCE DETAILS
=========================================================== -->

<div class="card shadow-sm mb-4">

    <div class="card-header bg-warning">

        <h5 class="mb-0">
            Grievance Details
        </h5>

    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-6">

                <label class="form-label">
                    Subject <span class="text-danger">*</span>
                </label>

                <input
                    type="text"
                    id="subject"
                    class="form-control"
                    maxlength="200"
                    placeholder="Enter grievance subject">

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Grievance Category
                </label>

                <select
                    id="category"
                    class="form-select">

                    <option value="">-- Select Category --</option>

                    <option>Roads</option>
                    <option>Drinking Water</option>
                    <option>Drainage</option>
                    <option>Housing</option>
                    <option>Pensions</option>
                    <option>MGNREGS</option>
                    <option>PMAY</option>
                    <option>Sanitation</option>
                    <option>Electricity</option>
                    <option>Agriculture</option>
                    <option>Revenue</option>
                    <option>Others</option>

                </select>

            </div>

        </div>

        <div class="row mt-3">

            <div class="col-md-12">

                <label class="form-label">
                    Grievance Description <span class="text-danger">*</span>
                </label>

                <textarea
                    id="description"
                    class="form-control"
                    rows="5"
                    maxlength="5000"
                    placeholder="Enter detailed grievance description"></textarea>

            </div>

        </div>

        <div class="row mt-3">

            <div class="col-md-6">

                <label class="form-label">
                    Upload Grievance Document
                </label>

                <input
                    type="file"
                    id="grievanceDocument"
                    class="form-control"
                    accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">

                <small class="text-muted">
                    Allowed: PDF, DOC, DOCX, JPG, PNG
                </small>

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Grievance Source
                </label>

                <select
                    id="source"
                    class="form-select">

                    <option>CPGRAMS Portal</option>
                    <option>Email</option>
                    <option>Post</option>
                    <option>In Person</option>
                    <option>Telephone</option>
                    <option>Other</option>

                </select>

            </div>

        </div>

    </div>

</div>

<!-- ==========================================================
OFFICE PROCESSING
=========================================================== -->

<div class="card shadow-sm mb-4">

    <div class="card-header bg-info text-white">

        <h5 class="mb-0">
            Office Processing
        </h5>

    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-4">

                <label class="form-label">
                    Assigned Officer
                </label>

                <select
                    id="assignedOfficer"
                    class="form-select">
                </select>

            </div>

            <div class="col-md-4">

                <label class="form-label">
                    Concerned Section
                </label>

                <select
                    id="section"
                    class="form-select">

                    <option value="">-- Select Section --</option>

                    <option>Administration</option>
                    <option>Accounts</option>
                    <option>Engineering</option>
                    <option>MGNREGS</option>
                    <option>PMAY</option>
                    <option>General</option>

                </select>

            </div>

            <div class="col-md-4">

                <label class="form-label">
                    ATR Received
                </label>

                <select
                    id="atrReceived"
                    class="form-select">

                    <option>No</option>
                    <option>Yes</option>

                </select>

            </div>

        </div>

        <div class="row mt-3">

            <div class="col-md-4">

                <label class="form-label">
                    Date of ATR
                </label>

                <input
                    type="date"
                    id="atrDate"
                    class="form-control">

            </div>

            <div class="col-md-4">

                <label class="form-label">
                    Disposal Date
                </label>

                <input
                    type="date"
                    id="disposedDate"
                    class="form-control">

            </div>

            <div class="col-md-4">

                <label class="form-label">
                    Final Status
                </label>

                <select
                    id="finalStatus"
                    class="form-select">

                    <option>Under Circulation</option>
                    <option>Pending</option>
                    <option>Disposed</option>
                    <option>Closed</option>

                </select>

            </div>

        </div>

        <div class="row mt-3">

            <div class="col-md-12">

                <label class="form-label">
                    Office Remarks
                </label>

                <textarea
                    id="remarks"
                    rows="4"
                    maxlength="2000"
                    class="form-control"
                    placeholder="Enter office remarks here..."></textarea>

            </div>

        </div>

    </div>

</div>
