<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CPGRAMS Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="../../css/style.css">

</head>

<body>

<header class="bg-primary text-white text-center p-3">

    <h5>GOVERNMENT OF TELANGANA</h5>

    <h6>OFFICE OF THE COMMISSIONER OF RURAL DEVELOPMENT</h6>

    <h3>FILE MANAGEMENT SYSTEM (FMS)</h3>

</header>

<div class="container mt-4">

<div class="d-flex justify-content-between">

<h3>CPGRAMS File Registration</h3>

<div>

<button class="btn btn-secondary"
        onclick="goHome()">

Home

</button>

<button class="btn btn-primary"
        onclick="saveCPGRAMS()">

Save

</button>

<button class="btn btn-warning"
        onclick="clearForm('cpgramsForm')">

Clear

</button>

</div>

</div>

<hr>

<form id="cpgramsForm">

<div class="row">

<div class="col-md-4">

<label class="form-label">

File Number

</label>

<input type="text"
       id="fileNumber"
       class="form-control"
       readonly>

</div>

<div class="col-md-4">

<label class="form-label">

Grievance Number

</label>

<input type="text"
       id="grievanceNumber"
       class="form-control">

</div>

<div class="col-md-4">

<label class="form-label">

Date Received

</label>

<input type="date"
       id="dateReceived"
       class="form-control">

</div>

</div>

<br>

<div class="row">

<div class="col-md-6">

<label class="form-label">

Complainant Name

</label>

<input type="text"
       id="complainantName"
       class="form-control">

</div>

<div class="col-md-6">

<label class="form-label">

District

</label>

<select id="district"
        class="form-select">

<option value="">--Select--</option>

</select>

</div>

</div>

<br>

<div class="row">

<div class="col-md-6">

<label class="form-label">

Mandal

</label>

<input type="text"
       id="mandal"
       class="form-control">

</div>

<div class="col-md-6">

<label class="form-label">

Village

</label>

<input type="text"
       id="village"
       class="form-control">

</div>

</div>

<br>

<div class="row">

<div class="col-md-12">

<label class="form-label">

Subject

</label>

<input type="text"
       id="subject"
       class="form-control">

</div>

</div>

<br>

<div class="row">

<div class="col-md-12">

<label class="form-label">

Grievance Description

</label>

<textarea id="description"
          rows="5"
          class="form-control"></textarea>

</div>

</div>

<br>

<div class="row">

<div class="col-md-4">

<label class="form-label">

Due Date

</label>

<input type="date"
       id="dueDate"
       class="form-control"
       readonly>

</div>

<div class="col-md-4">

<label class="form-label">

Assigned To

</label>

<select id="assignedTo"
        class="form-select">

<option value="">--Select--</option>

</select>

</div>

<div class="col-md-4">

<label class="form-label">

Status

</label>

<select id="status"
        class="form-select">

<option>Under Circulation</option>

<option>Disposed</option>

</select>

</div>

</div>

<br>

<div class="row">

<div class="col-md-12">

<label class="form-label">

Remarks

</label>

<textarea id="remarks"
          rows="3"
          class="form-control"></textarea>

</div>

</div>

</form>

</div>

<footer class="bg-light text-center mt-5 p-3">

<small>

© <span id="currentYear"></span>

File Management System

Version

<span id="appVersion"></span>

</small>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../../js/app.js"></script>
<script src="../../js/navigation.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/storage.js"></script>
<script src="../../js/master-data.js"></script>
<script src="../../js/validation.js"></script>
<script src="../../js/id-generator.js"></script>
<script src="cpgrams.js"></script>

</body>

</html>
