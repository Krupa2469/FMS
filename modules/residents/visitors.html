<div class="module-container"><h2 class="module-title">Visitor Registration</h2>
<div class="summary-grid"><div class="summary-card dashboard-clickable" data-visitor-dashboard="today" role="button" tabindex="0"><h4>Today</h4><span id="visitorToday" class="dashboard-number">0</span></div><div class="summary-card dashboard-clickable" data-visitor-dashboard="in" role="button" tabindex="0"><h4>Currently In</h4><span id="visitorIn" class="dashboard-number">0</span></div><div class="summary-card dashboard-clickable" data-visitor-dashboard="total" role="button" tabindex="0"><h4>Total Records</h4><span id="visitorTotal" class="dashboard-number">0</span></div></div><div id="visitorActiveFilter" class="message" style="display:none"></div>
<div class="form-card"><div class="form-row"><div class="form-group"><label>Visit Date</label><input id="visitDate" type="date" class="form-control"></div><div class="form-group"><label>Visitor Name *</label><input id="visitorName" class="form-control"></div><div class="form-group"><label>Mobile</label><input id="visitorMobile" class="form-control"></div></div>
<div class="form-row"><div class="form-group"><label>Name *</label><select id="visitorPlot" class="form-control"></select></div><div class="form-group"><label>H.No.</label><input id="visitorHouse" class="form-control" readonly></div><div class="form-group"><label>Purpose</label><select id="visitorPurpose" class="form-control"><option>Personal Visit</option><option>Delivery</option><option>Service / Repair</option><option>Domestic Help</option><option>Official</option><option>Other</option></select></div><div class="form-group"><label>Vehicle No.</label><input id="visitorVehicle" class="form-control"></div></div>
<div class="form-row"><div class="form-group"><label>No. of Persons</label><input id="visitorPersons" type="number" min="1" value="1" class="form-control"></div><div class="form-group"><label>Entry Time</label><input id="visitorEntry" type="time" class="form-control"></div><div class="form-group"><label>Exit Time</label><input id="visitorExit" type="time" class="form-control"></div></div>
<div class="form-row"><div class="form-group"><label>Remarks</label><textarea id="visitorRemarks" class="form-control"></textarea></div></div>
<div class="button-row"><button id="visitorSave" class="btn btn-primary">Save Visitor</button><button id="visitorUpdate" class="btn btn-warning">Update Visitor</button><button id="visitorDelete" class="btn btn-danger">Delete Visitor</button><button id="visitorClear" class="btn btn-secondary">Clear</button></div><div id="visitorMessage" class="message"></div></div>
<div class="module-toolbar"><input id="visitorSearch" class="form-control search" placeholder="Search visitor, resident, purpose or vehicle"><button id="visitorRefresh" class="btn btn-light">Refresh</button></div>
<div class="table-wrap"><table class="table"><thead><tr><th>S.No.</th><th>Resident Name</th><th>H.No.</th><th>Date</th><th>Visitor Name</th><th>Purpose</th><th>Vehicle</th><th>Entry</th><th>Exit</th><th>Action</th></tr></thead><tbody id="visitorsBody"></tbody></table></div></div>
<script>
/* Rose Gardens 1.2.28 - Dashboard card navigation */
(function(){
  function go(key){
    var map={
      residents:['residents','Residents'], visitors:['visitors','Visitors'], complaints:['complaints','Complaints'], meetings:['meetings','Meetings'], documents:['documents','Documents'], notices:['notices','Notices'], communications:['communications','Communications'], developmentFundPayments:['developmentFundPayments','Colony Fund'], festivalFundPayments:['festivalFundPayments','Ganesh Festival'], ganeshFestivalCelebrations:['ganeshFestivalCelebrations','Ganesh Festival'], homeServices:['homeServices','Home Services'], serviceProviders:['serviceProviders','Service Providers'], billers:['billers','Utility Billers'], expenses:['expenses','Expenditure']
    };
    var x=map[key]; if(!x)return;
    try{ if(typeof window.showRegister==='function'){window.showRegister(x[0]);return;} if(typeof window.loadRegister==='function'){window.loadRegister(x[0]);return;} if(typeof window.navigateTo==='function'){window.navigateTo(x[0]);return;} if(typeof window.showSection==='function'){window.showSection(x[0]);return;} }catch(e){console.error(e);}
    var el=document.querySelector('[data-register="'+x[0]+'"], [data-module="'+x[0]+'"]'); if(el){el.click();return;}
    var buttons=[...document.querySelectorAll('button,a,[role="button"]')]; var b=buttons.find(function(n){return (n.textContent||'').trim().toLowerCase().indexOf(x[1].toLowerCase())>=0}); if(b)b.click();
  }
  document.addEventListener('click',function(e){var card=e.target.closest('[data-dashboard-card],[data-card-key]'); if(!card||card.closest('.association-dashboard-page'))return; var k=card.dataset.dashboardCard||card.dataset.cardKey; if(k)go(k);});
  window.RGMS=window.RGMS||{}; window.RGMS.dashboardCardNavigate=go;
})();
</script>
