<div class="module-container reports-page">
  <h2 class="module-title reports-page-title"><span>Reports</span><span>&amp;</span><span>Expenditure</span></h2>

  <div class="rg-report-main">

      <div class="form-card"><div class="form-row"><div class="form-group"><label>Report</label><select id="reportType" class="form-control"><option value="fundSummary">Colony Fund + Ganesh Festival Collection Summary (Telugu / English)</option><option value="residents">Residents</option><option value="development">Colony Fund Summary</option><option value="festival">Ganesh Festival Fund Summary</option><option value="ganeshSponsors">Ganesh Festival Sponsors</option><option value="dailyLedger">Daily Ledger</option><option value="complaints">Complaints</option><option value="visitors">Visitors</option><option value="meetings">Meetings</option><option value="documents">Documents</option></select></div><div class="form-group"><label>Report Range</label><select id="reportPeriod" class="form-control"><option value="currentFY">Current Financial Year</option><option value="year">Calendar Year</option><option value="custom">Custom Range</option></select></div><div class="form-group"><label>Financial Year</label><select id="reportFinancialYear" class="form-control"></select></div><div class="form-group"><label>Calendar Year</label><select id="reportYear" class="form-control"></select></div></div>
      <div class="form-row" id="customRange" hidden><div class="form-group"><label>From</label><input id="reportFrom" type="date" class="form-control"></div><div class="form-group"><label>To</label><input id="reportTo" type="date" class="form-control"></div></div>
      <div class="button-row"><button id="reportGenerate" class="btn btn-primary">Generate Report</button><button id="reportExcel" class="btn btn-success">Export Excel</button><button id="reportJpeg" class="btn btn-info">Export JPEG</button><button id="reportPdf" class="btn btn-warning">Print / Save PDF</button></div><div id="reportMessage" class="message"></div></div>

      <div class="summary-grid"><div class="summary-card"><h4>Records</h4><span id="reportCount" class="dashboard-figure-link" data-report-main-drill="records" role="button" tabindex="0">0</span></div><div class="summary-card"><h4 class="report-amount-label">Total Amount</h4><span id="reportAmount" class="dashboard-figure-link" data-report-main-drill="amount" role="button" tabindex="0">₹ 0</span></div><div class="summary-card"><h4>As on Today</h4><span id="reportPeriodLabel" class="rg-as-on-date">-</span></div></div>
      <div class="table-wrap"><table class="table" id="reportTable"><thead></thead><tbody></tbody></table></div>

      <div id="expenditureRegisterSection" class="form-card" style="margin-top:28px">
        <h3>Expenditure Register</h3>
        <div class="form-row"><div class="form-group"><label>Expenditure Variant</label><select id="expenditureVariant" class="form-control"><option value="Colony Fund">Colony Fund</option><option value="Ganesh Festival Fund">Ganesh Festival Fund</option></select></div><div class="form-group"><label>Financial Year</label><select id="expenditureFY" class="form-control"></select></div><div class="form-group"><label id="expenditureAdvanceLabel">Advance (₹)</label><input id="expenditureAdvance" type="number" min="0" step="0.01" class="form-control" placeholder="Enter advance paid"></div></div>
        <div class="form-row"><div class="form-group"><label>Voucher No.</label><input id="expenditureVoucher" class="form-control" readonly></div><div class="form-group"><label>Date *</label><input id="expenditureDate" type="date" class="form-control"></div><div class="form-group"><label>Description *</label><input id="expenditureParticulars" class="form-control" placeholder="Description of expenditure"></div></div>
        <div class="form-row"><div class="form-group"><label>Amount (₹) *</label><input id="expenditureAmount" type="number" min="0" step="0.01" class="form-control"></div><div class="form-group"><label>Balance to be paid (₹)</label><input id="expenditureBalance" type="number" min="0" step="0.01" class="form-control" readonly></div></div>
        <div class="form-group"><label>Remarks</label><input id="expenditureRemarks" class="form-control"></div>
        <div class="button-row"><button id="expenditureSave" class="btn btn-primary">Save</button><button id="expenditureUpdate" class="btn btn-warning">Update</button><button id="expenditureDelete" class="btn btn-danger">Delete</button><button id="expenditureClear" class="btn btn-secondary">Clear</button><button id="expenditureExcel" class="btn btn-success">Export Register</button><button id="expenditurePrint" class="btn btn-warning">Print Register</button></div><div id="expenditureMessage" class="message"></div>
        <div class="module-toolbar rg-register-filter-row"><select id="expenditureRegisterVariant" class="form-control"><option value="">All Fund Types</option><option value="Colony Fund">Colony Fund</option><option value="Ganesh Festival Fund">Ganesh Festival Fund</option></select><select id="expenditureRegisterFY" class="form-control"><option value="">All Financial Years</option></select><input id="expenditureSearch" class="form-control search" placeholder="Search description, voucher, variant or remarks"><button id="expenditureRefresh" class="btn btn-light">Refresh</button></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>S.No.</th><th>Description</th><th>Amount</th><th>Advance</th><th>Balance to be paid</th><th>Remarks</th><th>Action</th></tr></thead><tbody id="expenditureBody"></tbody></table></div>
      </div>
  </div>
</div>
