<div class="module-container notice-board-module">
<h2 class="module-title title-single-line">📢 Notice Board</h2>
<p class="muted">Publish notices, meeting updates and other association communications to all residents.</p>
<div class="form-card">
<div class="form-row"><div class="form-group"><label>Title *</label><input id="nbTitle" class="form-control" placeholder="Notice / meeting / communication title"></div><div class="form-group"><label>Type</label><select id="nbType" class="form-control"><option>Notice</option><option>Meeting</option><option>General Communication</option><option>Emergency</option></select></div></div>
<div class="form-group"><label>Message *</label><textarea id="nbMessage" class="form-control" rows="7" placeholder="Type the message to be displayed to all residents"></textarea></div>
<div class="inline"><button id="nbPublish" class="btn btn-primary">Publish to All Residents</button><button id="nbDelete" class="btn btn-danger" disabled>Delete Selected</button><button id="nbClear" class="btn btn-secondary">Clear</button><button id="nbRefresh" class="btn btn-light">Refresh</button></div>
<div id="nbStatus" class="portal-message"></div>
</div>
<div class="summary-section"><h3>Published Messages</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Type</th><th>Title</th><th>Message</th><th>Published By</th><th>Action</th></tr></thead><tbody id="nbBody"></tbody></table></div></div>
</div>
