<div class="module-container"><h2 class="module-title title-single-line">Complaint Registration</h2>
<div class="summary-grid"><div class="summary-card dashboard-clickable" data-complaint-dashboard="total" role="button" tabindex="0"><h4>Total</h4><span id="complaintTotal" class="dashboard-number">0</span></div><div class="summary-card dashboard-clickable" data-complaint-dashboard="open" role="button" tabindex="0"><h4>Open</h4><span id="complaintOpen" class="dashboard-number">0</span></div><div class="summary-card dashboard-clickable" data-complaint-dashboard="high" role="button" tabindex="0"><h4>High Priority</h4><span id="complaintHigh" class="dashboard-number">0</span></div><div class="summary-card dashboard-clickable" data-complaint-dashboard="closed" role="button" tabindex="0"><h4>Closed</h4><span id="complaintClosed" class="dashboard-number">0</span></div></div><div id="complaintActiveFilter" class="message" style="display:none"></div>
<div class="form-card"><div class="form-row"><div class="form-group"><label>Complaint No.</label><input id="complaintNo" class="form-control" readonly></div><div class="form-group"><label>Date</label><input id="complaintDate" type="date" class="form-control"></div><div class="form-group"><label>Name *</label><select id="complaintPlot" class="form-control"></select></div><div class="form-group"><label>H.No.</label><input id="complaintHouse" class="form-control" readonly></div></div>
<div class="form-row"><div class="form-group"><label>Category</label><select id="complaintCategory" class="form-control"><option>Maintenance</option><option>Security</option><option>Water</option><option>Electricity / Street Light</option><option>Sanitation</option><option>Road / Drainage</option><option>Noise / Nuisance</option><option>Other</option></select></div><div class="form-group"><label>Priority</label><select id="complaintPriority" class="form-control"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></div><div class="form-group"><label>Status</label><select id="complaintStatus" class="form-control"><option>Open</option><option>In Progress</option><option>Resolved</option><option>Closed</option></select></div></div>
<div class="form-row"><div class="form-group"><label>Subject *</label><input id="complaintSubject" class="form-control"></div><div class="form-group"><label>Assigned To</label><select id="complaintAssigned" class="form-control"><option value="">Unassigned</option></select><div class="small muted">President / Secretary can assign complaints to EC members.</div></div></div>
<div class="form-row"><div class="form-group"><label>Description *</label><textarea id="complaintDescription" class="form-control"></textarea></div><div class="form-group"><label>Resolution / Action Taken</label><textarea id="complaintResolution" class="form-control"></textarea></div></div>
<div class="form-row"><div class="form-group"><label>Due Date</label><input id="complaintDue" type="date" class="form-control"></div><div class="form-group"><label>Closed Date</label><input id="complaintClosedDate" type="date" class="form-control"></div><div class="form-group"><label>Remarks</label><input id="complaintRemarks" class="form-control"></div></div>
<div class="button-row"><button id="complaintSave" class="btn btn-primary">Save Complaint</button><button id="complaintUpdate" class="btn btn-warning" disabled>Update Complaint</button><button id="complaintDelete" class="btn btn-danger" disabled>Delete Complaint</button><button id="complaintClear" class="btn btn-secondary">Clear</button><button id="complaintPrint" class="btn btn-warning">Print</button></div><div id="complaintMessage" class="message"></div></div>
<div class="module-toolbar"><input id="complaintSearch" class="form-control search" placeholder="Search complaint no., resident, subject, category or status"><button id="complaintRefresh" class="btn btn-light">Refresh</button></div>
<div class="table-wrap"><table class="table"><thead><tr><th>S.No.</th><th>Name</th><th>H.No.</th><th>Complaint No.</th><th>Date</th><th>Subject</th><th>Category</th><th>Priority</th><th>Status</th><th>Assigned</th><th>Action</th></tr></thead><tbody id="complaintsBody"></tbody></table></div></div>
<script>
/* Rose Gardens 1.2.28 - Dashboard card navigation */
(function(){
  function go(key){
    var map={
      residents:['residents','Residents'], visitors:['visitors','Visitors'], complaints:['complaints','Complaints'], meetings:['meetings','Meetings'], documents:['documents','Documents'], notices:['notices','Notices'], communications:['communications','Communications'], developmentFundPayments:['developmentFundPayments','Colony Fund'], festivalFundPayments:['festivalFundPayments','Ganesh Festival'], ganeshFestivalCelebrations:['ganeshFestivalCelebrations','Ganesh Festival'], homeServices:['homeServices','Home Services'], serviceProviders:['serviceProviders','Service Providers'], billers:['billers','Utility Billers'], expenses:['expenses','Expenditure']
    };
    var x=map[key]; if(!x)return;
    try{ if(typeof window.showRegister==='function'){window.showRegister(x[0]);return;} if(typeof window.loadRegister==='function'){window.loadRegister(x[0]);return;} if(typeof window.navigateTo==='function'){window.navigateTo(x[0]);return;} if(typeof window.showSection==='function'){window.showSection(x[0]);return;} }catch(e){console.error(e);}
    var el=document.querySelector('[data-register="'+x[0]+'"], [data-module="'+x[0]+'"]'); if(el){el.click();return;}
    var buttons=[...document.querySelectorAll('button,a,[role="button"]')]; var b=buttons.find(function(n){return (n.textContent||'').trim().toLowerCase().indexOf(x[1].toLowerCase())>=0}); if(b)b.click();
  }
  document.addEventListener('click',function(e){var card=e.target.closest('[data-dashboard-card],[data-card-key]'); if(!card||card.closest('.association-dashboard-page'))return; var k=card.dataset.dashboardCard||card.dataset.cardKey; if(k)go(k);});
  window.RGMS=window.RGMS||{}; window.RGMS.dashboardCardNavigate=go;
})();
</script>
