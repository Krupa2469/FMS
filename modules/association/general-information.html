<div class="module-container"><h2 class="module-title">General Information & Public Utility Services</h2>
<div class="summary-grid"><div class="summary-card dashboard-clickable" data-info-dashboard="total" role="button" tabindex="0"><h4>Total Services</h4><span id="infoTotal" class="dashboard-number">0</span></div><div class="summary-card dashboard-clickable" data-info-dashboard="emergency" role="button" tabindex="0"><h4>Emergency</h4><span id="infoEmergency" class="dashboard-number">0</span></div><div class="summary-card dashboard-clickable" data-info-dashboard="hospitals" role="button" tabindex="0"><h4>Hospitals</h4><span id="infoHospitals" class="dashboard-number">0</span></div><div class="summary-card dashboard-clickable" data-info-dashboard="active" role="button" tabindex="0"><h4>Active</h4><span id="infoActive" class="dashboard-number">0</span></div></div><div id="infoActiveFilter" class="message" style="display:none"></div>
<div class="form-card" id="infoAdminForm"><h3 class="section-heading">Service Register</h3><div class="form-row"><div class="form-group"><label>Service Type *</label><select id="infoType" class="form-control"><option>Hospital</option><option>Police</option><option>Fire & Emergency</option><option>Ambulance</option><option>Electricity</option><option>Water</option><option>Gas</option><option>Municipal / GHMC</option><option>Transport</option><option>School / Education</option><option>Government Office</option><option>Other Public Utility</option></select></div><div class="form-group"><label>Service / Hospital Name *</label><input id="infoName" class="form-control"></div><div class="form-group"><label>Department</label><input id="infoDepartment" class="form-control"></div></div>
<div class="form-row"><div class="form-group"><label>Phone</label><input id="infoPhone" class="form-control"></div><div class="form-group"><label>Emergency Number</label><input id="infoEmergencyNo" class="form-control"></div><div class="form-group"><label>Website</label><input id="infoWebsite" class="form-control"></div></div>
<div class="form-row"><div class="form-group"><label>Address</label><textarea id="infoAddress" class="form-control"></textarea></div><div class="form-group"><label>Notes / Services</label><textarea id="infoNotes" class="form-control"></textarea></div><div class="form-group"><label>Status</label><select id="infoStatus" class="form-control"><option>Active</option><option>Inactive</option></select></div></div>
<div class="button-row"><button id="infoSave" class="btn btn-primary">Save</button><button id="infoUpdate" class="btn btn-warning">Update</button><button id="infoDelete" class="btn btn-danger">Delete</button><button id="infoClear" class="btn btn-secondary">Clear</button></div><div id="infoMessage" class="message"></div></div>
<div class="module-toolbar"><input id="infoSearch" class="form-control search" placeholder="Search hospital, utility, department or phone"><select id="infoFilter" class="form-control" style="max-width:220px"><option value="">All Services</option><option>Hospital</option><option>Police</option><option>Fire & Emergency</option><option>Ambulance</option><option>Electricity</option><option>Water</option><option>Gas</option><option>Municipal / GHMC</option><option>Transport</option><option>School / Education</option><option>Government Office</option><option>Other Public Utility</option></select><button id="infoRefresh" class="btn btn-light">Refresh</button></div>
<div class="table-wrap"><table class="table"><thead><tr><th>Type</th><th>Name</th><th>Department</th><th>Phone</th><th>Emergency</th><th>Address</th><th>Website</th><th>Action</th></tr></thead><tbody id="infoBody"></tbody></table></div></div>
<script>
/* Rose Gardens 1.2.28 - Dashboard card navigation */
(function(){
  function go(key){
    var map={
      residents:['residents','Residents'], visitors:['visitors','Visitors'], complaints:['complaints','Complaints'], meetings:['meetings','Meetings'], documents:['documents','Documents'], notices:['notices','Notices'], communications:['communications','Communications'], developmentFundPayments:['developmentFundPayments','Colony Fund'], festivalFundPayments:['festivalFundPayments','Ganesh Festival'], ganeshFestivalCelebrations:['ganeshFestivalCelebrations','Ganesh Festival'], homeServices:['homeServices','Home Services'], serviceProviders:['serviceProviders','Service Providers'], billers:['billers','Utility Billers'], expenses:['expenses','Expenditure']
    };
    var x=map[key]; if(!x)return;
    try{ if(typeof window.showRegister==='function'){window.showRegister(x[0]);return;} if(typeof window.loadRegister==='function'){window.loadRegister(x[0]);return;} if(typeof window.navigateTo==='function'){window.navigateTo(x[0]);return;} if(typeof window.showSection==='function'){window.showSection(x[0]);return;} }catch(e){console.error(e);}
    var el=document.querySelector('[data-register="'+x[0]+'"], [data-module="'+x[0]+'"]'); if(el){el.click();return;}
    var buttons=[...document.querySelectorAll('button,a,[role="button"]')]; var b=buttons.find(function(n){return (n.textContent||'').trim().toLowerCase().indexOf(x[1].toLowerCase())>=0}); if(b)b.click();
  }
  document.addEventListener('click',function(e){var card=e.target.closest('[data-dashboard-card],[data-card-key]'); if(!card||card.closest('.association-dashboard-page'))return; var k=card.dataset.dashboardCard||card.dataset.cardKey; if(k)go(k);});
  window.RGMS=window.RGMS||{}; window.RGMS.dashboardCardNavigate=go;
})();
</script>
