<div class="module-container"><h2 class="module-title">Documents</h2>
<div class="summary-grid"><div class="summary-card dashboard-clickable" data-document-dashboard="total" role="button" tabindex="0"><h4>Total Documents</h4><span id="docTotal" class="dashboard-number">0</span></div><div class="summary-card dashboard-clickable" data-document-dashboard="month" role="button" tabindex="0"><h4>Uploaded This Month</h4><span id="docMonth" class="dashboard-number">0</span></div></div><div id="documentActiveFilter" class="message" style="display:none"></div>
<div class="form-card" id="docAdminForm"><div class="form-row"><div class="form-group"><label>Document Title *</label><input id="docTitle" class="form-control"></div><div class="form-group"><label>Category</label><select id="docCategory" class="form-control"><option>Association</option><option>Finance</option><option>Meetings</option><option>Notices</option><option>Legal</option><option>Residents</option><option>Other</option></select></div><div class="form-group"><label>Document Date</label><input id="docDate" type="date" class="form-control"></div></div>
<div class="form-row"><div class="form-group"><label>Select File *</label><input id="docFile" type="file" class="form-control" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.txt"></div><div class="form-group"><label>Description</label><textarea id="docDescription" class="form-control"></textarea></div></div>
<div class="button-row"><button id="docUpload" class="btn btn-primary">Upload Document</button><button id="docUpdate" class="btn btn-success">Modify Selected</button><button id="docDelete" class="btn btn-danger">Delete Selected</button><button id="docClear" class="btn btn-secondary">Clear</button></div><div id="docMessage" class="message"></div></div>
<p class="muted">Residents can view documents from their Resident Portal. Only Admin can upload or delete association documents.</p>
<div class="module-toolbar"><input id="docSearch" class="form-control search" placeholder="Search title, category or description"><button id="docRefresh" class="btn btn-light">Refresh</button></div>
<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Title</th><th>Category</th><th>File</th><th>Uploaded By</th><th>Action</th></tr></thead><tbody id="documentsBody"></tbody></table></div></div>
<script>
/* Rose Gardens 1.2.28 - Dashboard card navigation */
(function(){
  function go(key){
    var map={
      residents:['residents','Residents'], visitors:['visitors','Visitors'], complaints:['complaints','Complaints'], meetings:['meetings','Meetings'], documents:['documents','Documents'], notices:['notices','Notices'], communications:['communications','Communications'], developmentFundPayments:['developmentFundPayments','Colony Fund'], festivalFundPayments:['festivalFundPayments','Ganesh Festival'], ganeshFestivalCelebrations:['ganeshFestivalCelebrations','Ganesh Festival'], homeServices:['homeServices','Home Services'], serviceProviders:['serviceProviders','Service Providers'], billers:['billers','Utility Billers'], expenses:['expenses','Expenditure']
    };
    var x=map[key]; if(!x)return;
    try{ if(typeof window.showRegister==='function'){window.showRegister(x[0]);return;} if(typeof window.loadRegister==='function'){window.loadRegister(x[0]);return;} if(typeof window.navigateTo==='function'){window.navigateTo(x[0]);return;} if(typeof window.showSection==='function'){window.showSection(x[0]);return;} }catch(e){console.error(e);}
    var el=document.querySelector('[data-register="'+x[0]+'"], [data-module="'+x[0]+'"]'); if(el){el.click();return;}
    var buttons=[...document.querySelectorAll('button,a,[role="button"]')]; var b=buttons.find(function(n){return (n.textContent||'').trim().toLowerCase().indexOf(x[1].toLowerCase())>=0}); if(b)b.click();
  }
  document.addEventListener('click',function(e){var card=e.target.closest('[data-dashboard-card],[data-card-key]'); if(!card||card.closest('.association-dashboard-page'))return; var k=card.dataset.dashboardCard||card.dataset.cardKey; if(k)go(k);});
  window.RGMS=window.RGMS||{}; window.RGMS.dashboardCardNavigate=go;
})();
</script>
