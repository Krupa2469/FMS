  if (src && /\/(app|store|auth|navigation|firebase-core)\.js/i.test(src)) {
    window.RGMS.startupScriptError = `${src.split("/").pop()}: ${event.message || "script error"}`;

  }
}, true);

<script>
/* RGMS Android 1.2.14 - final interaction safety layer */
(function(){
  function keepVisible(el){
    if(!el) return;
    setTimeout(function(){try{el.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});}catch(e){}},140);
  }
  document.addEventListener('focusin',function(e){
    if(e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) keepVisible(e.target);
  });
  window.RGMSRefreshAllData=async function(){
    const keys=Object.values(window.RGMS?.STORAGE_KEYS||{});
    for(const key of keys){try{await window.RGMS.store.loadCollection(key);}catch(e){console.warn('Refresh failed',key,e);}}
    if(window.RGMS.navigation?.loadModule){
      const active=document.querySelector('.menu-item.active')?.dataset.module;
      if(active) await window.RGMS.navigation.loadModule(active,{pushHistory:false});
    }
  };
})();
</script>
<script>
window.RGMS=window.RGMS||{}; window.RGMS.consumeDashboardFilter=function(module){try{const raw=sessionStorage.getItem('RG_DASHBOARD_FILTER');if(!raw)return null;const d=JSON.parse(raw);if(!d||Date.now()-Number(d.ts||0)>60000)return null;if(d.module&&d.module!==module)return null;return d;}catch(e){return null;}};
/* Rose Gardens 1.2.51 - dashboard register filtering */
(function(){
  const map={
    residentsOccupied:{module:'residents',filter:'Occupied',searchId:'residentSearch'},
    colonyFund:{module:'development-fund',tab:'history',filter:'__CURRENT_MONTH__'},
    colonyFundPending:{module:'development-fund',tab:'pending',filter:'__PENDING__'},
    ganeshPaid:{module:'festival',filter:'__PAID__',searchId:'ganeshSearch'},
    complaintsOpen:{module:'complaints',filter:'__OPEN__',searchId:'complaintSearch'},
    visitorsToday:{module:'visitors',filter:'__TODAY__',searchId:'visitorSearch'},
    meetingsUpcoming:{module:'meetings',filter:'__UPCOMING__',searchId:'meetingSearch'},
    documents:{module:'documents',filter:'',searchId:'docSearch'}
  };
  function go(key){
    const cfg=map[key]; if(!cfg)return;
    try{sessionStorage.setItem('RG_DASHBOARD_FILTER',JSON.stringify({key,filter:cfg.filter||'',searchId:cfg.searchId||'',tab:cfg.tab||'',ts:Date.now()}));}catch(e){}
    try{
      if(window.RGMS?.navigation?.loadModule){ window.RGMS.navigation.loadModule(cfg.module,{pushHistory:true}); return; }
      const el=document.querySelector('[data-module="'+cfg.module+'"]'); if(el){el.click();return;}
    }catch(e){console.error(e);}
  }
  document.addEventListener('click',function(e){const card=e.target.closest('[data-dashboard-card]');if(!card)return;if(card.closest('.association-dashboard-page'))return;go(card.dataset.dashboardCard);});
  document.addEventListener('keydown',function(e){const card=e.target.closest('[data-dashboard-card]');if(!card||card.closest('.association-dashboard-page'))return;if(e.key==='Enter'||e.key===' '){e.preventDefault();go(card.dataset.dashboardCard);}});
  window.RGMS=window.RGMS||{}; window.RGMS.dashboardCardNavigate=go;
})();
</script>

<script>
/* Rose Gardens 1.2.85 - all dashboard/summary cards are interactive */
(function(){
  const special=c=>c.matches('.dashboard-clickable,[data-dashboard-card],[data-colony-dashboard],[data-ganesh-dashboard],[data-resident-dashboard]');
  function makeCardInteractive(card){
    if(special(card)||card.dataset.rgGenericInteractive==='1') return;
    card.dataset.rgGenericInteractive='1';
    card.setAttribute('role','button');
    card.setAttribute('tabindex','0');
    card.classList.add('rg-generic-card-clickable');
  }
  function revealRegister(card){
    const module=card.closest('.module-container');
    if(!module)return;
    const table=module.querySelector('.table-wrap, table');
    if(table){
      table.scrollIntoView({behavior:'smooth',block:'center'});
      table.classList.add('rg-card-target-highlight');
      setTimeout(()=>table.classList.remove('rg-card-target-highlight'),1200);
      return;
    }
    module.scrollIntoView({behavior:'smooth',block:'start'});
  }
  function scan(){document.querySelectorAll('.summary-card').forEach(makeCardInteractive);}
  document.addEventListener('click',e=>{const card=e.target.closest('.summary-card.rg-generic-card-clickable');if(card){e.preventDefault();revealRegister(card);}});
  document.addEventListener('keydown',e=>{const card=e.target.closest('.summary-card.rg-generic-card-clickable');if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();revealRegister(card);}});
  new MutationObserver(scan).observe(document.getElementById('content-area')||document.body,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',scan);
  scan();
})();
</script>
