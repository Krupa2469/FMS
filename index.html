<style>
body.rg-home-page{min-height:100dvh;background:linear-gradient(180deg,#eef5fb 0%,#f7fafc 100%);overflow-y:auto;color:#263238}
.rg-home-header{flex-direction:column!important;align-items:center!important;text-align:center!important;gap:8px!important}
.rg-home-header img{width:92px!important;height:92px!important;flex:0 0 92px!important}
.rg-home-header h1{font-size:clamp(25px,6vw,40px)!important}
@media(max-width:800px){.rg-home-header img{width:78px!important;height:78px!important;flex-basis:78px!important}}
.rg-home-wrap{width:min(980px,100%);margin:0 auto;padding:18px 14px 28px}
.rg-home-header{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 5px 22px rgba(16,45,70,.12);display:flex;align-items:center;gap:15px}
.rg-home-header img{width:68px;height:68px;object-fit:contain;flex:0 0 68px}.rg-home-header h1{margin:0;color:#0b4f8a;font-size:clamp(24px,5vw,38px);line-height:1.1}.rg-home-header p{margin:6px 0 0;color:#667085;font-size:15px}
.rg-home-title{display:none}
.rg-role-grid{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.rg-role-card{border:1px solid #d6e0e8;background:#fff;border-radius:15px;min-height:135px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;box-shadow:0 3px 12px rgba(0,0,0,.07);cursor:pointer;color:#0b4f8a;font-weight:700}
.rg-role-card:hover,.rg-role-card:focus{background:#f1f7fc;outline:2px solid #1f6fb2}.rg-role-icon{font-size:31px}.rg-role-name{font-size:16px;text-align:center}
@media(max-width:800px){.rg-role-card{min-height:96px;width:100%}.rg-home-header{padding:14px}.rg-home-header img{width:54px;height:54px;flex-basis:54px}}
@media(max-width:380px){.rg-role-grid{gap:10px}.rg-role-name{font-size:15px}}
</style>
<style id="rgms-home-centered-logo-final">
.rg-home-header{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important;gap:8px!important}
.rg-home-header img{width:92px!important;height:92px!important;flex:0 0 92px!important;object-fit:contain!important}
.rg-home-header>div{display:flex!important;flex-direction:column!important;align-items:center!important}

<body class="rg-home-page">
<div class="rg-home-wrap">
<header class="rg-home-header"><img src="assets/logo.png" alt="Rose Gardens"><div><h1>Rose Gardens</h1><p>Cheeryal Ward, Keesara Circle,<br><span class="rg-address-nowrap">Medchal Malkajgiri District - 501303</span></p></div></header>
<h2 class="rg-home-title">Select Your Login</h2>
<section class="rg-role-grid" aria-label="Login role selection">
<button class="rg-role-card" data-role="Resident" type="button"><span class="rg-role-icon">🏡</span><span class="rg-role-name">Residents</span></button>
<button class="rg-role-card" data-role="President" type="button"><span class="rg-role-icon">👤</span><span class="rg-role-name">President</span></button>
<button class="rg-role-card" data-role="Vice President" type="button"><span class="rg-role-icon">👤</span><span class="rg-role-name">Vice President</span></button>
<button class="rg-role-card" data-role="Secretary" type="button"><span class="rg-role-icon">📋</span><span class="rg-role-name">Secretary</span></button>
<button class="rg-role-card" data-role="Joint Secretary 1" type="button"><span class="rg-role-icon">📋</span><span class="rg-role-name">Joint Secretary 1</span></button>
<button class="rg-role-card" data-role="Joint Secretary 2" type="button"><span class="rg-role-icon">📋</span><span class="rg-role-name">Joint Secretary 2</span></button>
<button class="rg-role-card" data-role="Treasurer" type="button"><span class="rg-role-icon">💰</span><span class="rg-role-name">Treasurer</span></button>
<button class="rg-role-card" data-role="Admin" type="button"><span class="rg-role-icon">⚙️</span><span class="rg-role-name">Admin</span></button>
</section>

</div>
<script src="js/core/app.js?v=1.2.284"></script>

<script>
document.querySelectorAll('[data-role]').forEach(card=>card.addEventListener('click',()=>{window.location.href='login.html?role='+encodeURIComponent(card.dataset.role);}));
</script>
<script>
/* Rose Gardens 1.2.28 - Dashboard card navigation */
(function(){
  function go(key){
    var map={
      residents:['residents','Residents'], visitors:['visitors','Visitors'], complaints:['complaints','Complaints'], meetings:['meetings','Meetings'], documents:['documents','Documents'], notices:['notices','Notices'], communications:['communications','Communications'], developmentFundPayments:['developmentFundPayments','Colony Fund'], festivalFundPayments:['festivalFundPayments','Ganesh Festival'], ganeshFestivalCelebrations:['ganeshFestivalCelebrations','Ganesh Festival'], homeServices:['homeServices','Home Services'], serviceProviders:['serviceProviders','Service Providers'], billers:['billers','Utility Billers'], expenses:['expenses','Expenditure']
    };
    var x=map[key]; if(!x)return;
    try{ if(typeof window.showRegister==='function'){window.showRegister(x[0]);return;} if(typeof window.loadRegister==='function'){window.loadRegister(x[0]);return;} if(typeof window.navigateTo==='function'){window.navigateTo(x[0]);return;} if(typeof window.showSection==='function'){window.showSection(x[0]);return;} }catch(e){console.error(e);}
    var el=document.querySelector('[data-register="'+x[0]+'"], [data-module="'+x[0]+'"]'); if(el){el.click();return;}
    var buttons=[...document.querySelectorAll('button,a,[role="button"]')]; var b=buttons.find(function(n){return (n.textContent||'').trim().toLowerCase().indexOf(x[1].toLowerCase())>=0}); if(b)b.click();
  }
  document.addEventListener('click',function(e){var card=e.target.closest('[data-dashboard-card],[data-card-key]'); if(!card||card.closest('.association-dashboard-page'))return; var k=card.dataset.dashboardCard||card.dataset.cardKey; if(k)go(k);});
  window.RGMS=window.RGMS||{}; window.RGMS.dashboardCardNavigate=go;
})();
</script>
</body>
