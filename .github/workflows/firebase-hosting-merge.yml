# FMS temporary deployment workflow
# Deploys Firebase Hosting only from master.
# Firestore and Storage rules deployment is intentionally skipped until the
# Google Cloud service account is granted Service Usage permission to inspect
# firestore.googleapis.com and firebasestorage.googleapis.com.

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Firebase Hosting only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CRD_TG_FMS_2026 }}
          channelId: live
          projectId: crd-tg-fms-2026
