<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMS Central Document Parser</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h3 class="mb-1">FMS Central Document Parser</h3>
      <div class="text-muted">One document processing service for CPGRAMS, RTI, DISHA and generic references.</div>
    </div>
    <button class="btn btn-dark" onclick="goHome()"><i class="bi bi-house"></i> Home</button>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label">Module</label>
          <select id="parserModule" class="form-select">
            <option value="CPGRAMS">CPGRAMS</option>
            <option value="RTI">RTI</option>
            <option value="DISHA">DISHA</option>
            <option value="GENERIC">Generic</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Document</label>
          <input id="parserFile" type="file" class="form-control" accept=".pdf,.txt,.png,.jpg,.jpeg">
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button id="btnCentralParse" class="btn btn-primary flex-fill"><i class="bi bi-magic"></i> Parse</button>
          <button id="btnCentralClear" class="btn btn-outline-secondary">Clear</button>
        </div>
      </div>
      <div id="parserStatus" class="small text-muted mt-3">Supported: PDF, TXT, PNG and JPG. Scanned documents use OCR when available.</div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header">Extracted Text</div>
        <div class="card-body"><textarea id="parserText" class="form-control" rows="22" readonly></textarea></div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="card shadow-sm mb-4">
        <div class="card-header">Parsed Fields</div>
        <div class="card-body"><pre id="parserFields" class="mb-0" style="white-space:pre-wrap;max-height:420px;overflow:auto;">No result yet.</pre></div>
      </div>
      <div class="card shadow-sm">
        <div class="card-body">
          <div><strong>Extraction:</strong> <span id="parserMethod">-</span></div>
          <div><strong>OCR used:</strong> <span id="parserOCR">-</span></div>
          <div><strong>Document type:</strong> <span id="parserType">-</span></div>
          <div><strong>Confidence:</strong> <span id="parserConfidence">-</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="../js/services/document-parser.js"></script>
<script src="../js/services/parser/layout-detector.js"></script>
<script src="../js/services/parser/parser-utils.js"></script>
<script src="../js/services/parser/name-extractor.js"></script>
<script src="../js/services/parser/address-extractor.js"></script>
<script src="../js/services/parser/description-extractor.js"></script>
<script src="../js/services/parser/validation-engine.js"></script>
<script src="../js/services/parser/confidence-engine.js"></script>
<script src="../js/services/parser/keyword-engine.js"></script>
<script src="../js/services/parser/field-extractor.js"></script>
<script src="../js/services/parser/subject-engine.js"></script>
<script src="../js/services/parser/parser-core.js"></script>
<script src="../js/services/parser/module-parsers.js"></script>
<script src="../js/document/document-engine.js"></script>
<script src="../js/services/fms-parser-service.js"></script>
<script>
function goHome(){ location.href="../index.html"; }
document.getElementById('btnCentralParse').addEventListener('click', async function(){
  const file=document.getElementById('parserFile').files[0];
  const module=document.getElementById('parserModule').value;
  const status=document.getElementById('parserStatus');
  if(!file){status.textContent='Please select a document first.';return;}
  status.textContent='Parsing document…';
  try{
    const result=await FMSParserService.parseFile(file,module);
    document.getElementById('parserText').value=result.text||'';
    document.getElementById('parserFields').textContent=JSON.stringify(result.fields||{},null,2);
    document.getElementById('parserMethod').textContent=result.extractionMethod||'-';
    document.getElementById('parserOCR').textContent=result.ocrUsed?'Yes':'No';
    document.getElementById('parserType').textContent=result.documentType||'-';
    document.getElementById('parserConfidence').textContent=FMSParserService.formatConfidence(result.fields?.confidence||{})+'%';
    status.textContent='Parsing completed successfully. Review the extracted fields before using them.';
  }catch(e){status.textContent=e.message||String(e);}
});
document.getElementById('btnCentralClear').addEventListener('click',function(){
  document.getElementById('parserFile').value='';document.getElementById('parserText').value='';document.getElementById('parserFields').textContent='No result yet.';
  ['parserMethod','parserOCR','parserType','parserConfidence'].forEach(id=>document.getElementById(id).textContent='-');
  document.getElementById('parserStatus').textContent='Ready for another document.';
});
</script>
</body>
</html>
