<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMS Module Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/dashboard.css">
<style>
body{background:#f4f6f9}
.module-header{background:#0d6efd;color:#fff;padding:22px 15px;text-align:center}
.module-header h2{margin:0;font-weight:700}
.module-header .subtitle{opacity:.95;margin-top:5px}
.metric-card{border:0;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.10);min-height:145px}
.metric-card .metric-icon{font-size:28px}
.metric-value{font-size:38px;font-weight:700;line-height:1.1}
.action-card{border:0;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.status-line{font-size:14px}
.dashboard-metric-card{transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}.dashboard-metric-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.16)!important}</style>
</head>
<body>
<header class="module-header">
  <div>GOVERNMENT OF TELANGANA</div>
  <div class="small">OFFICE OF THE COMMISSIONER, RURAL DEVELOPMENT</div>
  <h2 id="moduleTitle">MODULE DASHBOARD</h2>
  <div class="subtitle">File Management System</div>
</header>

<nav class="navbar bg-white border-bottom shadow-sm">
  <div class="container-fluid p-2 d-flex gap-2 flex-wrap">
    <button class="btn btn-success" id="btnNew"><i class="bi bi-file-earmark-plus"></i> New</button>
    <button class="btn btn-primary" id="btnRegister"><i class="bi bi-table"></i> Register</button>
    <button class="btn btn-warning" id="btnDaily"><i class="bi bi-calendar-check"></i> Daily Status</button>
    <button class="btn btn-info text-white" id="btnReports"><i class="bi bi-bar-chart"></i> Reports</button>
    <button class="btn btn-success" id="btnWhatsApp"><i class="bi bi-whatsapp"></i> Daily Status WhatsApp</button>
    <button class="btn btn-secondary" id="btnMasters"><i class="bi bi-database"></i> Masters</button>
    <button class="btn btn-dark ms-auto" id="btnHome"><i class="bi bi-house"></i> FMS Home</button>
  </div>
</nav>

<main class="container-fluid py-4">
  <div id="dashboardStatus" class="alert alert-info d-none"></div>
  <div class="row g-3" id="cards"></div>

  <div class="card action-card mt-4">
    <div class="card-header bg-primary text-white fw-bold">Quick Actions</div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-3"><button class="btn btn-success w-100" id="btnNew2"><i class="bi bi-plus-circle"></i> New Record</button></div>
        <div class="col-md-3"><button class="btn btn-outline-primary w-100" id="btnReport2"><i class="bi bi-file-earmark-text"></i> Module Report</button></div>
        <div class="col-md-3"><button class="btn btn-outline-warning w-100" id="btnDaily2"><i class="bi bi-calendar3"></i> Daily Status</button></div>
        <div class="col-md-3"><button class="btn btn-outline-secondary w-100" id="btnRefresh"><i class="bi bi-arrow-clockwise"></i> Refresh Dashboard</button></div>
      </div>
    </div>
  </div>

  <div class="card action-card mt-4">
    <div class="card-header fw-bold">Dashboard Status</div>
    <div class="card-body">
      <div id="lastUpdated" class="status-line text-muted">Loading...</div>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<script src="../js/fms-financial-year.js"></script>
<script src="../js/firebase/firebase-bootstrap.js"></script>
<script src="../js/services/whatsapp-service.js"></script>
<script src="../js/module-dashboard.js"></script>
</body>
</html>
