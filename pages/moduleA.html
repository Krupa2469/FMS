<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Module A - Citizen & Administrative Files</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common CSS -->

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<!-- ======================================================
HEADER
====================================================== -->

<header class="bg-primary text-white text-center p-3">

    <h5 class="mb-1">
        GOVERNMENT OF TELANGANA
    </h5>

    <h6 class="mb-1">
        OFFICE OF THE COMMISSIONER OF RURAL DEVELOPMENT
    </h6>

    <h3 class="fw-bold">
        FILE MANAGEMENT SYSTEM (FMS)
    </h3>

</header>

<!-- ======================================================
PAGE TITLE
====================================================== -->

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center">

        <h3>

            Module A - Citizen & Administrative Files

        </h3>

        <button class="btn btn-secondary"
                onclick="goHome()">

            Home

        </button>

    </div>

    <hr>

    <!-- ==================================================
    DASHBOARD SUMMARY
    =================================================== -->

    <div class="row mt-3">

        <div class="col-md-4">

            <div class="card text-center shadow">

                <div class="card-header bg-dark text-white">

                    Total Files

                </div>

                <div class="card-body">

                    <h2 id="totalFiles">

                        0

                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card text-center shadow">

                <div class="card-header bg-warning">

                    Files Under Circulation

                </div>

                <div class="card-body">

                    <h2 id="filesUnderCirculation">0</h2>

                        0

                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card text-center shadow">

                <div class="card-header bg-success text-white">

                    Disposed Files

                </div>

                <div class="card-body">

                    <h2 id="disposedFiles">

                        0

                    </h2>

                </div>

            </div>

        </div>

    </div>

    <!-- ==================================================
    MODULES
    =================================================== -->

    <div class="row mt-5 g-3">

        <div class="col-md-4">

            <button class="btn btn-primary w-100"
                    onclick="openCPGRAMS()">

                CPGRAMS

            </button>

        </div>

        <div class="col-md-4">

            <button class="btn btn-primary w-100">

                Prajavani

            </button>

        </div>

        <div class="col-md-4">

            <button class="btn btn-primary w-100">

                Public Grievances

            </button>

        </div>

        <div class="col-md-4">

            <button class="btn btn-primary w-100">

                Direct Complaints

            </button>

        </div>

        <div class="col-md-4">

            <button class="btn btn-primary w-100">

                Assembly Questions

            </button>

        </div>

        <div class="col-md-4">

            <button class="btn btn-primary w-100">

                Court Cases

            </button>

        </div>

        <div class="col-md-4">

            <button class="btn btn-primary w-100">

                VIP References

            </button>

        </div>

        <div class="col-md-4">

            <button class="btn btn-primary w-100">

                CMO References

            </button>

        </div>

        <div class="col-md-4">

            <button class="btn btn-primary w-100">

                Audit Paras

            </button>

        </div>

        <div class="col-md-4">

            <button class="btn btn-primary w-100">

                Vigilance Cases

            </button>

        </div>

    </div>

</div>

<!-- ======================================================
FOOTER
====================================================== -->

<footer class="bg-light text-center mt-5 p-3">

    <small>

        © <span id="currentYear"></span>

        File Management System (FMS)

        | Version

        <span id="appVersion"></span>

    </small>

</footer>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Common JS -->

<script src="../js/app.js"></script>

<script src="../js/navigation.js"></script>

<script src="../js/common.js"></script>

<script src="../js/storage.js"></script>

<script src="../js/master-data.js"></script>

<script src="../js/validation.js"></script>

<!-- Module JS -->

<script src="../modules/moduleA/moduleA.js"></script>

</body>

</html>
