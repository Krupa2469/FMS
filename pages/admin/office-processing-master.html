<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Processing Masters | FMS</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/master.css">
    <style>
        .master-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .page-title { text-align:center; margin:20px 0; }
        .grid { width:100%; }
    </style>
</head>
<body>

<header class="page-header">
    <h2>Government of Telangana</h2>
    <h3>File Management System (FMS)</h3>
    <h4>Office Processing Master Administration</h4>
</header>

<div class="container">

    <div class="card">
        <h3>Office Processing Masters</h3>
        <p class="text-muted">
            These masters are shared by CPGRAMS, RTI and DISHA.
            Sections added here are immediately available in all three modules.
        </p>

        <label for="masterCollection"><b>Master</b></label>
        <select id="masterCollection" class="form-control">
            <option value="sections">Sections</option>
            <option value="officeCommunicationTypes">Type of Communication</option>
            <option value="fileStatuses">Status of File</option>
        </select>
    </div>

    <div class="card">
        <div class="row g-3">
            <div class="col-md-5">
                <label for="masterName"><b>Name / Value</b></label>
                <input id="masterName" class="form-control" maxlength="120">
            </div>
            <div class="col-md-3">
                <label for="masterCode"><b>Code</b></label>
                <input id="masterCode" class="form-control" maxlength="30">
            </div>
            <div class="col-md-4">
                <label for="masterDescription"><b>Description</b></label>
                <input id="masterDescription" class="form-control" maxlength="250">
            </div>
            <div class="col-md-12">
                <label>
                    <input type="checkbox" id="masterActive" checked>
                    Active
                </label>
            </div>
        </div>
    </div>

    <div class="card buttonBar">
        <div class="master-actions">
            <button id="btnMasterNew" class="btn btn-secondary">New</button>
            <button id="btnMasterSave" class="btn btn-success">Save / Update</button>
            <button id="btnMasterDelete" class="btn btn-danger">Delete</button>
            <button id="btnAdminHome" class="btn btn-dark">Back to Admin</button>
        </div>
    </div>

    <div class="card">
        <table id="officeMasterGrid" class="grid">
            <thead>
                <tr>
                    <th>Sl.No</th>
                    <th>Name / Value</th>
                    <th>Code</th>
                    <th>Status</th>
                    <th>Edit</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../../js/firebase/firebase-config.js"></script>
<script src="../../js/firebase/firebase-loader.js"></script>
<script src="../../js/firebase/firebase-ready.js"></script>
<script src="../../js/firebase/firebase-service.js"></script>
<script src="office-processing-master.js"></script>

</body>
</html>
