<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FMS Reports</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><style>body{background:#f4f6f9}.sticky-tools{position:sticky;top:0;z-index:50}.summary-card{cursor:pointer}</style></head><body>
<header class="bg-primary text-white text-center p-3"><h5 class="mb-1">GOVERNMENT OF TELANGANA</h5><h6 class="mb-1">OFFICE OF THE COMMISSIONER, RURAL DEVELOPMENT</h6><h3 class="fw-bold mb-0">FILE MANAGEMENT SYSTEM — REPORTS</h3></header>
<nav class="navbar bg-white border-bottom shadow-sm sticky-tools"><div class="container-fluid d-flex gap-2 flex-wrap p-2"><button class="btn btn-dark" id="btnHome"><i class="bi bi-house"></i> Home</button><button class="btn btn-secondary" id="btnMasters"><i class="bi bi-database"></i> Masters</button><button class="btn btn-primary" id="btnReportsMaster"><i class="bi bi-sliders"></i> Reports Master</button><button class="btn btn-outline-primary" id="btnRefresh"><i class="bi bi-arrow-repeat"></i> Refresh Data</button><button class="btn btn-success" id="btnWhatsApp"><i class="bi bi-whatsapp"></i> WhatsApp</button></div></nav>
<main class="container-fluid py-4">
<div class="card shadow-sm mb-4"><div class="card-body"><div class="row g-3 align-items-end">
<div class="col-lg-3 col-md-6"><label class="form-label fw-semibold">Standard Report / Module</label><select id="reportModule" class="form-select"><option value="all">All Modules — Daily Status</option><option value="cpgrams">CPGRAMS Report</option><option value="rti">RTI Report</option><option value="disha">DISHA Report</option></select></div>
<div class="col-lg-3 col-md-6"><label class="form-label fw-semibold">Saved Custom Report</label><select id="customReport" class="form-select"><option value="">— Standard report —</option></select></div>
<div class="col-lg-2 col-md-4"><label class="form-label">From Date</label><input id="fromDate" type="date" class="form-control"></div><div class="col-lg-2 col-md-4"><label class="form-label">To Date</label><input id="toDate" type="date" class="form-control"></div><div class="col-lg-2 col-md-4"><button class="btn btn-primary w-100" id="btnGenerate"><i class="bi bi-table"></i> Generate</button></div>
<div class="col-12 d-flex gap-2 flex-wrap border-top pt-3"><button class="btn btn-success" id="btnExcel"><i class="bi bi-file-earmark-excel"></i> Excel</button><button class="btn btn-danger" id="btnPDF"><i class="bi bi-file-earmark-pdf"></i> PDF</button><button class="btn btn-secondary" id="btnJPEG"><i class="bi bi-image"></i> JPEG</button><button class="btn btn-dark" id="btnPrint"><i class="bi bi-printer"></i> Print</button><span id="reportStatus" class="ms-auto small text-muted align-self-center"></span></div>
</div></div></div>
<div class="row g-3 mb-4" id="summaryCards"></div>
<div class="card shadow-sm"><div class="card-header bg-primary text-white"><div class="d-flex justify-content-between align-items-center"><span id="reportTitle" class="fw-bold">FMS Report</span><span id="recordCount" class="badge bg-light text-dark">0 records</span></div></div><div class="card-body p-0"><div class="table-responsive"><table id="reportTable" class="table table-bordered table-striped table-hover mb-0"><thead></thead><tbody><tr><td class="text-center text-muted p-5">Loading report data...</td></tr></tbody></table></div></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-functions-compat.js"></script><script src="../js/firebase/firebase-bootstrap.js"></script><script src="../js/services/export-service.js"></script><script src="../js/services/whatsapp-service.js"></script><script src="../js/reports/reports.js"></script></body></html>
