<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMS Reports</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="bg-primary text-white text-center p-3">
<h5 class="mb-1">GOVERNMENT OF TELANGANA</h5>
<h6 class="mb-1">OFFICE OF THE COMMISSIONER, RURAL DEVELOPMENT</h6>
<h3 class="fw-bold mb-0">FILE MANAGEMENT SYSTEM — REPORTS</h3>
</header>
<nav class="navbar bg-light border-bottom"><div class="container-fluid d-flex gap-2 flex-wrap p-2">
<button class="btn btn-dark" id="btnHome"><i class="bi bi-house"></i> Home</button>
<button class="btn btn-secondary" id="btnMasters"><i class="bi bi-database"></i> Masters</button>
<button class="btn btn-primary" id="btnRefresh"><i class="bi bi-arrow-repeat"></i> Refresh</button>
</div></nav>
<main class="container-fluid py-4">
<div class="card shadow-sm mb-4"><div class="card-body">
<div class="row g-3 align-items-end">
<div class="col-md-3"><label class="form-label fw-semibold">Module</label>
<select id="reportModule" class="form-select">
<option value="all">All Modules — Daily Status</option><option value="cpgrams">CPGRAMS Report</option><option value="rti">RTI Report</option><option value="disha">DISHA Report</option><option value="moduleA">Module A Summary</option>
</select></div>
<div class="col-md-2"><label class="form-label">From Date</label><input id="fromDate" type="date" class="form-control"></div>
<div class="col-md-2"><label class="form-label">To Date</label><input id="toDate" type="date" class="form-control"></div>
<div class="col-md-5 d-flex gap-2 flex-wrap">
<button class="btn btn-success" id="btnGenerate"><i class="bi bi-table"></i> Generate Report</button>
<button class="btn btn-outline-success" id="btnExcel"><i class="bi bi-file-earmark-excel"></i> Excel</button>
<button class="btn btn-outline-danger" id="btnPDF"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
<button class="btn btn-outline-dark" id="btnPrint"><i class="bi bi-printer"></i> Print</button>
</div></div></div></div>
<div class="row g-3 mb-4" id="summaryCards"></div>
<div class="card shadow-sm"><div class="card-header bg-primary text-white"><div class="d-flex justify-content-between align-items-center">
<span id="reportTitle">Daily Status Report — All Modules</span><span id="recordCount" class="badge bg-light text-dark">0 records</span></div></div>
<div class="card-body p-0"><div class="table-responsive"><table id="reportTable" class="table table-bordered table-striped table-hover mb-0"><thead></thead><tbody><tr><td class="text-center text-muted p-5">Click Generate Report</td></tr></tbody></table></div></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<script src="../js/firebase/firebase-bootstrap.js"></script>
<script src="../js/reports/reports.js"></script>
</body></html>
